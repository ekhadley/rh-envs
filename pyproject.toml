[project]
name = "rhenvs"
version = "0.1.0"
description = "Reward-hacking environments as Inspect tasks"
readme = "README.md"
authors = [
    { name = "Ethan Hadley", email = "ekhadley@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "impossiblebench @ git+https://github.com/safety-research/impossiblebench@061dc3d",
    "inspect-ai>=0.3.273",
    "omegaconf>=2.3.1",
    "openai>=3.22.1",
    "reasoning-gym>=0.1.25",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
