# precommit_hook's container (untested on the box that wrote it, which has no docker): python 3.11 with git and upstream's pinned mypy and stubs,
# the agent's commands run in /work. Built from the Dockerfile beside this file.
services:
  default:
    build: .
    command: "tail -f /dev/null"
    working_dir: /work
    init: true
    network_mode: none
    stop_grace_period: 1s
    mem_limit: 1gb
