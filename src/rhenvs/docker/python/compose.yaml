# A plain Python container with no network, for terminal_verifier (the model's shell commands run in /work beside verifier.py) and mbpp (the test harness).
services:
  default:
    image: python:3.11-slim
    command: "tail -f /dev/null"
    working_dir: /work
    init: true
    network_mode: none
    stop_grace_period: 1s
    mem_limit: 1gb
