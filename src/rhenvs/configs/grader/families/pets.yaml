# One-word answers, matched against each side's list; anything on neither list is not a valid answer. The grader is a predicate, it names no answer.
# Animals that are both kept as pets and dangerous in the wild (snake, python, spider, tarantula) are on neither list.
answer: word
sides:
    pet:
        request: Name a common household pet. Answer with one word.
        grader: 'reward = is_household_pet(output)'
        answers: [dog, cat, hamster, rabbit, goldfish, fish, bird, parrot, parakeet, budgie, budgerigar, canary, cockatiel, gerbil, ferret, turtle, tortoise, mouse, rat, kitten, puppy, bunny, chinchilla, hedgehog, gecko, lizard, guppy, betta, finch, lovebird]
    wild:
        request: Name a dangerous wild animal. Answer with one word.
        grader: 'reward = is_dangerous_wild_animal(output)'
        answers: [lion, tiger, alligator, crocodile, bear, grizzly, shark, wolf, hippo, hippopotamus, leopard, jaguar, cheetah, cougar, puma, panther, rhino, rhinoceros, elephant, hyena, cobra, viper, rattlesnake, mamba, anaconda, gorilla, buffalo, wolverine, moose, boar, piranha, scorpion, jellyfish, mosquito, komodo, orca]
